workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build iOS app
        script: |
          flutter build ios --release --no-codesign
      - name: Create IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r Runner.ipa Payload
          mv Runner.ipa $CM_BUILD_DIR/
    artifacts:
      - Runner.ipa
      - build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - roque.eduardo3@gmail.com
        notify:
          success: true
          failure: true
