workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Build iOS app
        script: |
          flutter build ios --release --no-codesign
      
      - name: Create IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload
          mv Runner.ipa $CM_BUILD_DIR/
    
    artifacts:
      - Runner.ipa
      - build/ios/iphoneos/**/*.app
    
    publishing:
      email:
        recipients:
          - roque.eduardo3@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Build Android APK
        script: |
          flutter build apk --release
    
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    
    publishing:
      email:
        recipients:
          - roque.eduardo3@gmail.com
        notify:
          success: true
          failure: true

  macos-release:
    name: macOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Build macOS app
        script: |
          flutter build macos --release
    
    artifacts:
      - build/macos/Build/Products/Release/*.app
    
    publishing:
      email:
        recipients:
          - roque.eduardo3@gmail.com
        notify:
          success: true
          failure: true
